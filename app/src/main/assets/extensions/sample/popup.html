<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Sample</title>
  <style>
    body {
      margin: 0;
      width: 220px;
      font-family: system-ui, sans-serif;
      background: #15141f;
      color: #e9e9f2;
      padding: 14px;
    }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p { font-size: 11px; color: #b9b8c6; margin: 0 0 12px; line-height: 1.4; }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <h1>Nova Sample</h1>
  <p>This extension runs inside Nova. Toggle a dark filter on the current page.</p>
  <button id="toggle">Toggle dark mode</button>
  <script src="popup.js"></script>
</body>
</html>
