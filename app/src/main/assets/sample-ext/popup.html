<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nova Page Enhancer</title>
  <style>
    body { width: 240px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
    h3 { margin: 0 0 10px; font-size: 14px; }
    label { font-size: 12px; display: block; margin-top: 8px; }
    input[type=color] { width: 100%; height: 30px; border: none; padding: 0; }
    .status { font-size: 11px; color: #666; margin-top: 8px; min-height: 14px; }
  </style>
</head>
<body>
  <h3>Nova Page Enhancer</h3>
  <label>Link color</label>
  <input type="color" id="color" value="#ff6b35">
  <label style="display:flex; align-items:center; gap:6px;">
    <input type="checkbox" id="links" checked> Highlight links
  </label>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
