name: Build Nova PiP Video Test (feature branch)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for the PiP test build'
        required: true
        default: '1.4.6-pip-test'
  push:
    branches: [ feature/video-downloader, feature/pip-video-test ]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: nova-video-downloader-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nova PiP Video Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Nova source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK
        run: |
          cd "${{ github.workspace }}"
          ./automation/nova/install-sdk.sh || true

      - name: Create version name
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '1.4.6-pip-test' }}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building Nova PiP test APK, version $VERSION_NAME"

      - name: Build forkRelease variant
        timeout-minutes: 90
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx7g -Xms1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          export ANDROID_HOME=$HOME/android-sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$HOME/android-sdk/android-sdk-linux
          ./gradlew app:assembleForkRelease -PversionName=$VERSION_NAME --stacktrace --no-daemon

      - name: Setup build tool version variable
        run: |
          BUILD_TOOL_VERSION=$(ls "$HOME/android-sdk/android-sdk-linux/build-tools/" | sort -V | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> "$GITHUB_ENV"

      - name: Sign test APK (from repo secrets)
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH=$(find . -name "app-arm64-v8a-forkRelease-unsigned.apk" -print -quit)
          test -n "$APK_PATH"
          echo "Found: $APK_PATH"
          ls -alh "$APK_PATH"
          echo "$SIGNING_KEY_B64" | base64 -d > "$HOME/nova-release.keystore"
          "$HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner" sign \
            --ks "$HOME/nova-release.keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out nova-pip-video-test.apk "$APK_PATH"
          "$HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner" verify --print-certs nova-pip-video-test.apk
          ls -alh nova-pip-video-test.apk
          "$HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/aapt" dump badging nova-pip-video-test.apk | head -3

      - name: Upload test APK as artifact (no release)
        uses: actions/upload-artifact@v4
        with:
          name: nova-pip-video-test.apk
          path: nova-pip-video-test.apk
          retention-days: 30
