name: Build Nova Video Downloader (feature branch)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 3.0.0-video)'
        required: true
        default: '3.0.0-video'
  push:
    branches: [ feature/video-downloader ]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: nova-video-downloader-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nova Video Downloader APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Nova source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK
        run: |
          cd "${{ github.workspace }}"
          ./automation/nova/install-sdk.sh || true

      - name: Create version name
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '3.0.0-video' }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Building video-downloader test APK, version $VERSION_NAME"

      - name: Build forkRelease variant
        timeout-minutes: 90
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          export ANDROID_HOME=$HOME/android-sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$HOME/android-sdk/android-sdk-linux
          ./gradlew app:assembleForkRelease -PversionName=$VERSION_NAME --stacktrace --no-daemon

      - name: Setup build tool version variable
        run: |
          BUILD_TOOL_VERSION=$(ls $HOME/android-sdk/android-sdk-linux/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Sign test APK (from repo secrets)
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          APK_PATH=$(find . -name "app-arm64-v8a-forkRelease-unsigned.apk" | head -1)
          echo "Found: $APK_PATH"
          ls -alh "$APK_PATH"
          echo "$SIGNING_KEY_B64" | base64 -d > $HOME/nova-release.keystore
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner sign \
            --ks $HOME/nova-release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out nova-video-downloader.apk "$APK_PATH"
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner verify --print-certs nova-video-downloader.apk
          ls -alh nova-video-downloader.apk
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/aapt dump badging nova-video-downloader.apk | head -3

      - name: Upload test APK as artifact (no release)
        uses: actions/upload-artifact@v4
        with:
          name: nova-video-downloader.apk
          path: nova-video-downloader.apk
          retention-days: 30
