name: Build Nova Browser APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.5.0)'
        required: true
        default: '1.5.0'
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: nova-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nova Browser
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Nova source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK
        run: |
          cd "${{ github.workspace }}"
          ./automation/iceraven/install-sdk.sh || true

      - name: Create version name
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '1.5.0' }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Building $VERSION_NAME"

      - name: Build forkRelease variant
        timeout-minutes: 90
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          export ANDROID_HOME=$HOME/android-sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$HOME/android-sdk/android-sdk-linux
          ./gradlew app:assembleForkRelease -PversionName=$VERSION_NAME --stacktrace --no-daemon

      - name: Setup build tool version variable
        run: |
          BUILD_TOOL_VERSION=$(ls $HOME/android-sdk/android-sdk-linux/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Sign APK with release key (from repo secrets)
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          APK_PATH=$(find . -name "app-arm64-v8a-forkRelease-unsigned.apk" | head -1)
          echo "Found: $APK_PATH"
          ls -alh "$APK_PATH"
          echo "$SIGNING_KEY_B64" | base64 -d > $HOME/nova-release.keystore
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner sign \
            --ks $HOME/nova-release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out nova-browser.apk "$APK_PATH"
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner verify --print-certs nova-browser.apk
          ls -alh nova-browser.apk
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/aapt dump badging nova-browser.apk | head -3

      - name: Upload APK to release
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp nova-browser.apk "Nova Browser ${VERSION_NAME}.apk"
          gh release edit v3.0 --title "Nova Browser ${VERSION_NAME}" --repo codegeasse1/nova-browser 2>/dev/null || true
          gh release view v3.0 --json assets --jq '.assets[].name' --repo codegeasse1/nova-browser 2>/dev/null | while read a; do gh release delete-asset v3.0 "$a" --yes --repo codegeasse1/nova-browser 2>/dev/null; done
          gh release upload v3.0 "Nova Browser ${VERSION_NAME}.apk" --clobber --repo codegeasse1/nova-browser

      - name: Upload APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: nova-browser.apk
          path: nova-browser.apk
