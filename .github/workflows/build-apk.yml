name: Build APK

on:
  push:
    branches: [ build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK 37 platform
        run: |
          curl -sSfL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r02.zip
          mkdir -p /tmp/plat37
          unzip -q /tmp/platform-37.zip -d /tmp/plat37
          mkdir -p "$ANDROID_SDK_ROOT/platforms"
          rm -rf "$ANDROID_SDK_ROOT/platforms/android-37"
          mv /tmp/plat37/android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/' "$ANDROID_SDK_ROOT/platforms/android-37/source.properties"
          cat "$ANDROID_SDK_ROOT/platforms/android-37/source.properties" | head -5

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
