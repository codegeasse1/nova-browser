name: Build APK

on:
  push:
    branches: [ build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK 37 platform
        run: |
          curl -sSfL -o /tmp/platform-371.zip https://dl.google.com/android/repository/platform-37.1_r01.zip
          mkdir -p /tmp/plat371 "$ANDROID_SDK_ROOT/platforms"
          unzip -q /tmp/platform-371.zip -d /tmp/plat371
          rm -rf "$ANDROID_SDK_ROOT/platforms"/android-37*
          top=$(find /tmp/plat371 -mindepth 1 -maxdepth 1 -type d | head -1)
          mv "$top" "$ANDROID_SDK_ROOT/platforms/android-37.1"
          ls "$ANDROID_SDK_ROOT/platforms"
          grep AndroidVersion.ApiLevel "$ANDROID_SDK_ROOT/platforms/android-37.1/source.properties"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platform-tools" || true

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
