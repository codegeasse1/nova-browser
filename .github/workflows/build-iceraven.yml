name: Build Nova Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ build ]

permissions:
  contents: write

concurrency:
  group: iceraven-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nova Browser 2.46.0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone Iceraven source (exact upstream release)
        timeout-minutes: 30
        run: |
          git clone --depth 1 --branch iceraven-2.46.0 https://github.com/fork-maintainers/iceraven-browser iceraven
          cd iceraven
          git submodule update --init --recursive --depth 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: |
          cd iceraven
          ./automation/iceraven/install-sdk.sh

      - name: Create version name
        run: |
          cd iceraven
          VERSION_NAME="1.3.1"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Building $VERSION_NAME"

      - name: Patch on the fly (upstream Iceraven CI step)
        run: |
          cd iceraven
          ./automation/iceraven/patch_android_components.sh

      - name: Replace strings (upstream Iceraven CI step)
        run: |
          cd iceraven
          sed -i 's/Firefox/Iceraven/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Nova branding overlay
        run: |
          cp nova-branding.sh iceraven/nova-branding.sh
          cp -r nova-icons iceraven/nova-icons
          cp -r nova-assets iceraven/nova-assets
          cd iceraven
          bash nova-branding.sh

      - name: Build forkRelease variant of app
        timeout-minutes: 90
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          export ANDROID_HOME=$HOME/android-sdk/android-sdk-linux
          export ANDROID_SDK_ROOT=$HOME/android-sdk/android-sdk-linux
          cd iceraven
          ./gradlew app:assembleForkRelease -PversionName=$VERSION_NAME --stacktrace --no-daemon

      - name: Setup build tool version variable
        run: |
          BUILD_TOOL_VERSION=$(ls $HOME/android-sdk/android-sdk-linux/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Sign APK with release key (from repo secrets)
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          APK_PATH=$(find iceraven -name "app-arm64-v8a-forkRelease-unsigned.apk" | head -1)
          echo "Found: $APK_PATH"
          ls -alh "$APK_PATH"
          echo "$SIGNING_KEY_B64" | base64 -d > $HOME/nova-release.keystore
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner sign \
            --ks $HOME/nova-release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out nova-browser.apk "$APK_PATH"
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/apksigner verify --print-certs nova-browser.apk
          ls -alh nova-browser.apk
          $HOME/android-sdk/android-sdk-linux/build-tools/$BUILD_TOOL_VERSION/aapt dump badging nova-browser.apk | head -3

      - name: Upload APK to v3.0 release
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp nova-browser.apk "Nova Browser ${VERSION_NAME}.apk"
          gh release edit v3.0 --title "Nova Browser ${VERSION_NAME}" --repo codegeasse1/nova-browser 2>/dev/null || true
          gh release view v3.0 --json assets --jq '.assets[].name' | while read -r a; do gh release delete-asset v3.0 "$a" --yes; done
          gh release upload v3.0 "Nova Browser ${VERSION_NAME}.apk" --clobber
          gh release view v3.0 --json assets --jq '.assets[] | .name + " " + (.size|tostring)'

      - name: Upload APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: nova-browser.apk
          path: nova-browser.apk
